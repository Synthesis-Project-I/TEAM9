<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TARS Mock Preview</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f8fa;
        color: #1f2937;
      }

      header {
        padding: 24px 32px;
        background: #ffffff;
        border-bottom: 1px solid #dfe3e8;
      }

      main {
        padding: 24px 32px;
        display: grid;
        gap: 24px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      section {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        padding: 16px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #edf0f2;
        text-align: left;
        white-space: nowrap;
      }

      th {
        background: #f0f3f6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TARS Mock Preview</h1>
    </header>
    <main>
      <section>
        <h2>Clients</h2>
        <table id="clients"></table>
      </section>
      <section>
        <h2>Tasks</h2>
        <table id="tasks"></table>
      </section>
      <section>
        <h2>Translators</h2>
        <table id="translators"></table>
      </section>
    </main>
    <script>
      const api = "http://127.0.0.1:8010";

      async function loadTable(id, path) {
        const response = await fetch(`${api}${path}`);
        const json = await response.json();
        const rows = json.data;
        const table = document.getElementById(id);

        if (!rows.length) {
          table.innerHTML = "<tbody><tr><td>No data</td></tr></tbody>";
          return;
        }

        const columns = Object.keys(rows[0]).slice(0, 8);
        const head = `<thead><tr>${columns.map((column) => `<th>${column}</th>`).join("")}</tr></thead>`;
        const body = `<tbody>${rows.map((row) => `<tr>${columns.map((column) => `<td>${row[column] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody>`;
        table.innerHTML = head + body;
      }

      loadTable("clients", "/clients?per_page=8");
      loadTable("tasks", "/tasks?per_page=8");
      loadTable("translators", "/translators?per_page=8");
    </script>
  </body>
</html>
